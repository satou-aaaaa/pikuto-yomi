/* 地形図の紙：生成りの地に、記号の黒、水の藍、見出しの朱 */
:root{
  --bg:#eef2e6; --paper:#fffcf4; --ink:#1f2a44; --ink2:#4f566a; --line:#1f2a4426; --rule:#e2d7bd;
  --ai:#24427a; --ai2:#142a52; --shu:#b23c26; --shu2:#86291a; --ok:#25734a; --ok2:#174f31; --gold:#8a5f0a;
  --g:#1d4f91; --gbg:#e8f0fb; --l:#9a3412; --lbg:#fdf0e7; --e:#4f566a; --ebg:#eef0f3;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html.fs1{font-size:17px}html.fs2{font-size:20px}html.fs3{font-size:24px}
html{height:100%}body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-tap-highlight-color:transparent;line-height:1.6}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 88px;display:flex;flex-direction:column;gap:14px;min-height:100vh;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}
h1{font-weight:900;font-size:1.15rem;margin:0;letter-spacing:.04em;flex:1;min-width:0}
h1 small{display:block;font-size:.75rem;letter-spacing:0;color:var(--ink2);font-weight:500;line-height:1.3}
.icon{all:unset;cursor:pointer;font-size:1.2rem;min-width:52px;height:52px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);box-sizing:border-box;padding:0 10px;background:var(--paper);font-weight:700}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:16px;background:var(--shu);color:#fff;font-weight:900;font-size:1.1rem;padding:8px 18px;text-align:center;box-shadow:0 5px 0 var(--shu2);line-height:1.35;flex-wrap:wrap}
button.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shu2)}
button.main.alt{background:var(--ai);box-shadow:0 5px 0 var(--ai2)}
button.main.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok2)}
button.main small{font-weight:500;font-size:.8rem}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:.95rem;padding:4px 12px;text-align:center;line-height:1.3}
button.sub:disabled,button.main:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:.85rem;line-height:1.7;margin:0;text-align:center}
.note a,.about a,.verdict a,.detail a{color:var(--shu2);display:inline-flex;align-items:center;min-height:44px}
.big{font-weight:900;font-size:1.45rem;text-align:center;margin:0;line-height:1.35}
.title{font-weight:900;font-size:2.1rem;letter-spacing:.14em;text-align:center;margin:6px 0 0;color:var(--ai2)}
.title span{color:var(--shu)}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:6px;flex-wrap:wrap;margin:2px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:.95rem;line-height:1.7}
.fsrow{display:flex;gap:6px;align-items:center;justify-content:center;font-size:.85rem;color:var(--ink2)}
.fsrow button{all:unset;box-sizing:border-box;cursor:pointer;min-width:48px;min-height:44px;display:grid;place-items:center;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:900;color:var(--ink)}
.fsrow button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 辞書の頁 */
.pad{position:relative;background:var(--paper);background-image:repeating-linear-gradient(transparent 0 1.9rem,var(--rule) 1.9rem calc(1.9rem + 1px));border:2px solid var(--line);border-left:8px solid var(--shu);border-radius:6px 16px 16px 6px;padding:1rem .9rem 1.1rem;box-shadow:0 6px 16px #1f2a441c}
.q{margin:0 0 .6rem;font-weight:700;font-size:1rem;text-align:center}
/* 記号：このゲームのために描いたピクトグラム（丸と斜線・三角・丸は形でも分かる。赤い四角の火事の道具と緑の四角の安全は形が同じなので、中の絵と答えのあとの文で分ける） */
.sym{display:inline-grid;place-items:center;color:var(--ink)}
.sym svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;width:100%;height:100%}
.sym svg .F{fill:currentColor;stroke:none}
.hero{gap:10px!important}.hero .sym{width:3.4rem;height:3.4rem;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px;box-sizing:border-box}
.bigsym{width:8.5rem;height:8.5rem;margin:.2rem auto .4rem;display:grid;background:#fff;border:2px solid var(--line);border-radius:16px;padding:.6rem;box-sizing:border-box}
.ja{font-weight:900;font-size:1.6rem;text-align:center;margin:.1rem 0 .4rem;color:var(--ai2)}
.tip{background:var(--paper);border:2px dashed var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.9rem;line-height:1.7;text-align:left}
.tip b{color:var(--shu2)}
/* 選び肢 */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{all:unset;box-sizing:border-box;cursor:pointer;position:relative;min-height:4.2rem;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--paper);border:3px solid var(--ai);box-shadow:0 4px 0 #24427a55;font-weight:900;font-size:1.05rem;color:var(--ink);padding:1.1rem .5rem .6rem;text-align:center;line-height:1.35}
.ch:active{transform:translateY(3px);box-shadow:0 2px 0 #24427a55}
.ch.ng{opacity:.55;border-color:var(--shu);border-style:dashed;cursor:default;box-shadow:none;animation:shake .4s}
.ch.ng::after{content:"✕ ちがう";position:absolute;top:3px;right:8px;font-size:.72rem;font-weight:900;color:var(--shu2)}
.ch.ok{border-color:var(--ok);background:#eef7f0;box-shadow:0 4px 0 #25734a66}
.ch.ok::after{content:"✓ 正解";position:absolute;top:3px;right:8px;font-size:.72rem;font-weight:900;color:var(--ok2)}
.ch:disabled{cursor:default}
.choices.syms .ch{min-height:6.2rem;padding:1.2rem .4rem .5rem}
.choices.syms .ch .sym{width:4rem;height:4rem}
.choices.why .ch{grid-column:span 2;min-height:3.6rem;font-size:1rem;padding:1.05rem .7rem .5rem}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.msg{min-height:1.6rem;text-align:center;font-weight:700;font-size:1rem;margin:0}
.msg.bad{color:var(--shu2)}
.verdict{background:var(--paper);border:2px solid var(--ok);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 #1f2a4420;animation:up .35s ease-out}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:1.3rem;font-weight:900;flex-wrap:wrap}
.verdict .wd{text-align:center;margin:0;font-size:1.05rem}
.verdict .wd{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:1.25rem}
.verdict .wd .sym{width:4.2rem;height:4.2rem;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px;box-sizing:border-box}
.verdict .why{font-size:.95rem;line-height:1.7;margin:0;text-align:left}
.verdict .why b{color:var(--ok2)}
.verdict .src{margin:0;font-size:.8rem;text-align:right}
.hint{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.95rem;line-height:1.7}
.stars{color:var(--gold);letter-spacing:.08em;font-size:1.2rem}
.stars .off{color:#1f2a4433}
.dots{display:flex;gap:6px;flex:1;max-width:200px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--shu);height:12px;margin-top:-2px}.dots i.done{background:var(--ai)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:1.3rem}
.stats small{color:var(--ink2);font-size:.75rem}
.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:1rem;line-height:1.6;text-align:center;border:2px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:.9rem;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist div{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem;line-height:1.5}
.rlist .w{flex:1;min-width:0}
.rlist .w b{display:block;font-size:.95rem}
.rlist .sym{width:2.6rem;height:2.6rem;flex:none;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:3px;box-sizing:border-box}
.achnext{text-align:center;font-size:.9rem;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:.95rem;font-weight:700;color:var(--shu2);margin:0;animation:up .35s ease-out}
.badge{background:var(--shu);color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}
.lv{display:flex;flex-direction:column;gap:10px}
.lv small{display:block;font-weight:500;font-size:.78rem;color:var(--ink2)}
/* 記号帳 */
.book{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.book button,.book .no{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:5.4rem;border-radius:12px;padding:6px 2px;background:var(--paper);border:2px solid var(--line);font-size:.7rem;line-height:1.25;text-align:center}
.book button .sym{width:2.8rem;height:2.8rem;margin-bottom:3px}
.book .no{cursor:default;color:var(--ink2);border-style:dashed;font-size:1.2rem}
.detail{background:var(--paper);border:2px solid var(--ai);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;animation:up .3s ease-out}
.detail p{margin:0;font-size:.92rem;line-height:1.7}
.agrp{font-size:.85rem;color:var(--ink2);margin:4px 0 -6px;font-weight:700;letter-spacing:.1em}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:1.8rem 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:1.2rem;text-align:center}
.ach b{grid-area:nm;font-size:.95rem}.ach small{grid-area:cd;color:var(--ink2);font-size:.8rem;line-height:1.4}
.ach .pg{grid-area:pg;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--ai)}
.ach.got{background:#eef3fb;border-color:var(--ai)}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.5}
.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center;font-size:1.05rem}.calnav .sub{flex:0 0 72px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.7rem;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;background:var(--paper);border:1px solid var(--line);position:relative;line-height:1.1}
.cal .c i{font-style:normal;font-size:.55rem;letter-spacing:-.05em;color:var(--gold)}
.cal .c.p1{background:#eef3fb}.cal .c.p2{background:#d5e1f3}.cal .c.p3{background:var(--ai);color:#fff;border-color:var(--ai2)}.cal .c.p3 i{color:#ffe9a8}
.cal .c.late{background:transparent;border:1.5px dashed var(--ai);color:var(--ai2)}
.cal .c.miss{cursor:pointer;border:2px dotted var(--shu);color:var(--shu2);background:#fff}
.cal .c.miss i{color:var(--shu)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:.55rem;color:var(--shu);font-weight:900}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.75rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend em{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal}
.about h3{font-size:1rem;margin:.6rem 0 .2rem;color:var(--ai2)}
.about p,.about li{font-size:.92rem;line-height:1.8;text-align:left}
.about ul{padding-left:1.2em;margin:0}
dialog#howto{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px;box-sizing:border-box;font-size:1rem}
dialog#howto::backdrop{background:#000000aa}
dialog#howto h2{margin:0 0 10px;letter-spacing:.1em}
dialog#howto ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog#howto p{margin:0 0 10px;font-size:.9rem;line-height:1.7;color:var(--ink2)}
dialog#howto a{color:var(--shu2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center;font-size:1rem}
footer{margin-top:auto;text-align:center;font-size:.8rem;color:var(--ink2);display:flex;gap:4px 14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
/* 色の見分けを助ける：記号は色を使わず線だけ。正解・ちがうの印を大きく、枠を太く */
html.a11y-cvd .ch.ng::after,html.a11y-cvd .ch.ok::after{font-size:.95rem}
html.a11y-cvd .ch.ok{border-width:5px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* all:unset のボタンでも枠が消えないよう、いちばん最後に強く書く */
:is(.icon,button,a):focus-visible{outline:3px solid var(--shu)!important;outline-offset:2px}
</style>

<script>

const jstNow = () => new Date(Date.now() + 9 * 3600e3);

const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;

  ["色の意味", "赤は「してはいけない」と火事の道具、黄は「気をつけて」、青は「こうしてください」、緑は「安全・避難」。"],
  ["形の意味", "丸に斜線は禁止、三角は注意、丸は指示、四角は案内や安全の情報。色といっしょに形でも分かる。"],
  ["白と黒は案内", "トイレ・エレベーター・駅など、場所や設備を教える記号は、白地に黒い絵だけでかく。"],
  ["文字の頭文字", "「i」は information（案内）、「P」は parking（駐車場）。英語の頭文字が記号になったものもある。"],
  ["ことばがなくても", "案内用図記号は、ことばの分からない人や子どもにも伝わるように、絵だけで表すよう作られている。"],
  ["人の形を見る", "走る人・つまずく人・落ちる人。同じ人の形でも、まわりの色と形で「禁止」か「注意」かが変わる。"],
  ["緑は逃げ道", "非常口や津波避難場所は緑。火事や地震のとき、緑の記号をたどると逃げ道が分かる。"],

// ---- とことん・練習（乱数は練習ととことんだけ）----
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const shuf = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// とことん：記号よみ5 → 記号さがし10 → 残りの組（種類×記号）を全部まぜて。1つの並びの中で同じ組は出さない・同じ記号を続けない

function practiceList(kind, s) {

// days/hdays/adays：日付 → { m:[1問ごとのまちがい＋ヒント], k:[種類|記号] }。adays はあとから遊んだ日（連続の日・今日の記録・Ko-fi には数えない）

// ebest：とことんで一度で解いた数の自己ベスト
const fresh = () => ({ v: 1, days: {}, hdays: {}, adays: {}, dex: {}, runs: {}, tut: false, kofi: {}, ach: {}, ebest: 0 });
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
const doneOf = (r) => !!r && r.mode !== "e" && r.res.length >= r.list.length, recOf = (r) => ({ m: r.res.map((x) => x.m), k: r.list.map((t) => t.split("|").slice(0, 2).join("|")) });
const runKey = (mode, date) => (mode === "a" ? "a:" + date : mode);
const bookOf = (s, m) => (m === "d" ? s.days : m === "h" ? s.hdays : m === "a" ? s.adays : null);

function bank(s, r) { const b = doneOf(r) ? bookOf(s, r.mode) : null; if (!b || b[r.date] || (r.mode === "a" && s.days[r.date])) return false; b[r.date] = recOf(r); return true; }

  const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a], s = Object.assign(fresh(), n);

  s.runs = Object.assign({}, n.runs);

    if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = bookOf(s, r.mode); if (bd && !bd[r.date]) s.runs[m] = r; continue; }
    if (x.id !== y.id && x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; }

      // 同じ回・同じ問題の途中なら、両方のまちがい・ヒントを合わせる（片方のまちがいを消して★を多くしない）
      if (w && o && w.cur && o.cur && w.res.length === o.res.length && w.cur.i === o.cur.i && w.cur.tag === o.cur.tag) s.runs[m] = { ...w, cur: { ...w.cur, wrong: [...new Set([...(w.cur.wrong || []), ...(o.cur.wrong || [])])], hints: Math.max(+w.cur.hints || 0, +o.cur.hints || 0) } };

// 引き継ぎコードなどから入った値を正しい形に直す（数の所に文字が入っていても画面に出さない）

}
function hint() { if (cur.done || cur.hints >= 2) return; cur.hints++; keep(); paint(); }
function wrongAt(v, msg) {

}

function solved() {

    if (was) { cur.hints = Math.max(cur.hints, Math.min(was.hints || 0, 2)); for (const v of was.wrong || []) if (!cur.wrong.includes(v)) cur.wrong.push(v); }
    r.res.push({ m: missOf() }); r.cur = null; s.dex[x.i] = (s.dex[x.i] || 0) + 1;
  });

    <button class="main ok" id="next">${fin ? "結果を見る" : "次の問題へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur && cur.done && cur.tag === P.tag) $("next").scrollIntoView({ behavior: window.A11y && A11y.on("calm") ? "auto" : "smooth", block: "nearest" }); }, 60);

function finish() {
  const s = load(), run = s.runs[MODE];

  if (run.mode === "e") return endFinish(run);

// 共有の文：記号と答えは出さない。まちがい＋ヒントの数で色と形を変える（色だけで分けない）

function achView() {

// 遊んだ日のカレンダー：今日の5問の日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => { const d = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 7); };

function cal(ym) {

  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);

    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = s.adays[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" role="img" aria-label="${m}月${d}日 星${lv}つ">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }

    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }

  bindFooter(); toTop();
}
